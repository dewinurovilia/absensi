<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absensi & Nilai Siswa</title>
<style>
:root{--bg:#f4f6ff;--card:#fff;--tx:#1e2340;--mu:#6b7194;--pr:#5b5ff0;--pr2:#8a5cf6;--ok:#16a34a;--iz:#d97706;--sk:#2563eb;--al:#dc2626;--bd:#e4e7f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11142a;--card:#1b1f3d;--tx:#eef0ff;--mu:#9aa0c8;--bd:#2b305a}}
:root[data-theme="dark"]{--bg:#11142a;--card:#1b1f3d;--tx:#eef0ff;--mu:#9aa0c8;--bd:#2b305a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;padding:22px 18px 54px;border-radius:0 0 28px 28px}
header h1{margin:0;font-size:20px}header p{margin:4px 0 0;opacity:.85;font-size:13px}
main{max-width:720px;margin:-38px auto 0;padding:0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(60,60,140,.08)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:22px}.stats span{font-size:11px;color:var(--mu)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{border:1px solid var(--bd);background:var(--card);border-radius:16px;padding:12px 10px;text-align:left;color:var(--tx);cursor:pointer;display:flex;gap:10px;align-items:center;font:inherit}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background:linear-gradient(135deg,var(--pr),var(--pr2))}
.sw small{display:block;color:var(--mu);font-size:11px;margin-top:2px}.sw span.n{font-size:12.5px;font-weight:600;line-height:1.25;word-break:break-word}
.st-Hadir{border-color:var(--ok)}.st-Izin{border-color:var(--iz)}.st-Sakit{border-color:var(--sk)}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff;display:inline-block}
.t-Hadir{background:var(--ok)}.t-Izin{background:var(--iz)}.t-Sakit{background:var(--sk)}.t-Alpa{background:var(--al)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:12px;padding:6px;cursor:pointer}
nav button.on{color:var(--pr);font-weight:700}nav i{display:block;font-style:normal;font-size:20px}
.sheet{position:fixed;inset:0;background:rgba(10,10,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet>div{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.big{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-size:16px;font-weight:700;color:#fff;margin-top:10px;cursor:pointer}
.ghost{background:none;color:var(--mu);font-weight:500}
select,input[type=number],input[type=date],input[type=month]{font:inherit;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row .n{font-size:13px;font-weight:600;flex:1}input[type=number]{width:78px;text-align:center}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--bd)}td:first-child,th:first-child{text-align:left}
.note{font-size:12px;color:var(--mu);background:var(--card);border:1px dashed var(--bd);border-radius:12px;padding:8px 12px;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;display:none;z-index:20}
.seg{flex:1;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:9px;font:inherit;font-size:13px;cursor:pointer}.seg.on{background:var(--pr);color:#fff;border-color:var(--pr);font-weight:700}
h3{margin:0 0 10px;font-size:15px}.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:12px}.bar div{height:100%;background:linear-gradient(90deg,var(--ok),#4ade80)}
</style>
</head>
<body>
<header><h1>🏫 Absensi & Nilai Siswa</h1><p id="tgl"></p></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
const N=["AHMAD DIMAS ALFIANSYAH","AISYAH AYUDIA INARA","AMIRA BILQIS SURYANI","ARDARA FREDILLA ULANI","FEDRIN SATRIA RAJADA","FITA INDRIYANI","MOHAMAD APRILEO PRATAMA","MUHAMMAD ONY FEBRIANTO","NATASYA ARSYINTA DWI NUR SAQILA","RAYA FRISKA AZZAHRA PUTRI","RIZKI PUTRA PRATAMA","ROBI'AH WIDYA ASANTI"];
const MP=[["MTK","Matematika"],["BIN","Bahasa Indonesia"],["BING","Bahasa Inggris"],["IPAS","IPAS"],["PPKN","PPKn"],["SBK","Seni Budaya"],["BJW","Bahasa Jawa"],["KDG","Koding"],["LDG","Literasi Digital"]];
const JT=["Harian","UTS","UAS"];
const $=s=>document.querySelector(s);
const today=new Date().toLocaleDateString('sv-SE');
let db=null,canG=false,mode='wait',tab='absen',sel=null,mp="MTK",jt="Harian",A={},V={},D={},fb=null,per={t:'harian',v:today};
$('#tgl').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2200)}
function saveLocal(){try{localStorage.setItem('absn',JSON.stringify({A,V}))}catch(e){}}
async function init(){
  try{const c=window.claude;if(c){db=await c.use('db');const u=await c.use('user');canG=u?u.canEdit():false}}catch(e){db=null}
  if(db){mode='online';
    db.collection('absen').onSnapshot(s=>{A={};s.docs.forEach(d=>A[d.id]=d.data());render()},()=>{});
    db.collection('nilai').onSnapshot(s=>{V={};s.docs.forEach(d=>V[d.id]=d.data());render()},()=>{});
  }else{mode='local';canG=true;try{const o=JSON.parse(localStorage.getItem('absn')||'{}');A=o.A||{};V=o.V||{}}catch(e){}}
  render();
}
function todayRec(i){return A[today+'_'+i]}
function setAbsen(i,st){
  const k=today+'_'+i;
  if(st==null){delete A[k];if(db)db.collection('absen').doc(k).delete().catch(()=>toast('Gagal menyimpan'))}
  else{const r={i,date:today,status:st,time:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})};A[k]=r;if(db)db.collection('absen').doc(k).set(r).catch(()=>toast('Gagal menyimpan'))}
  saveLocal();render();
}
function typeNilai(i,v){D[[mp,jt,i].join('_')]=v;const n=Object.keys(D).length,b=$('#sv');if(b)b.textContent='💾 Simpan Nilai'+(n?' ('+n+' belum disimpan)':'')}
function simpanNilai(){
  const ks=Object.keys(D);if(!ks.length){toast('Belum ada nilai yang diubah');return}
  ks.forEach(k=>{const [m,j,i]=k.split('_'),v=D[k];
    if(v===''){delete V[k];if(db)db.collection('nilai').doc(k).delete().catch(()=>{})}
    else{const r={mp:m,jt:j,i:+i,v:Math.max(0,Math.min(100,+v)),d:today};V[k]=r;if(db)db.collection('nilai').doc(k).set(r).catch(()=>toast('Gagal menyimpan (hanya guru)'))}});
  D={};saveLocal();render();toast('Nilai tersimpan ✅')
}
function setPer(t){per={t,v:t=='bulanan'?today.slice(0,7):today};render()}
function pick(i){
  const r=todayRec(i);
  if(r&&!canG){toast('Kamu sudah absen: '+r.status);return}
  sel=i;render();
}
function choose(st){const i=sel;sel=null;setAbsen(i,st);toast('Absen tercatat: '+st+' ✅')}
const ini=n=>n.split(' ').slice(0,2).map(w=>w[0]).join('');
const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
const ymd=d=>d.toLocaleDateString('sv-SE');
function rng(){const v=per.v||today;if(per.t=='harian')return[v,v,v];
  if(per.t=='bulanan'){const[y,m]=v.split('-');return[y+'-'+m+'-01',y+'-'+m+'-31',v]}
  const d=new Date(v+'T00:00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);const a=ymd(d);d.setDate(d.getDate()+6);const b=ymd(d);return[a,b,a+'_sd_'+b]}
async function unduh(nama,rows){
  const csv='\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n');
  try{const d=window.claude&&await window.claude.use('downloads');if(!d)throw{code:'na'};await d.save({filename:nama,data:csv});toast('File siap ✅')}
  catch(e){if(e&&e.code=='declined')return;fb={n:nama,t:rows.map(r=>r.map(c=>String(c??'').replace(/[\t\r\n]+/g,' ')).join('\t')).join('\n')};render()}
}
function salin(){const t=$('#fbt');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
  if(!ok&&navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>toast('Tersalin ✅'),()=>toast('Tekan lama lalu salin'));else toast(ok?'Tersalin ✅':'Tekan lama lalu salin')}
function unduhAbsen(){
  const[a,b,lb]=rng();
  let dates=[...new Set(Object.values(A).map(r=>r.date))].filter(d=>d>=a&&d<=b).sort();
  if(per.t=='harian'&&!dates.length)dates=[a];
  const rows=[['No','Nama',...dates,'Hadir','Izin','Sakit','Alpa','% Hadir']];
  N.forEach((n,i)=>{const c={Hadir:0,Izin:0,Sakit:0};const cells=dates.map(d=>{const r=A[d+'_'+i];if(r)c[r.status]++;return r?r.status:'Alpa'});
    rows.push([i+1,n,...cells,c.Hadir,c.Izin,c.Sakit,dates.length-c.Hadir-c.Izin-c.Sakit,dates.length?Math.round(c.Hadir/dates.length*100):0])});
  unduh('absen-'+per.t+'-'+lb+'.csv',rows);
}
function unduhNilai(){
  const[a,b,lb]=rng();
  const cols=[];MP.forEach(m=>JT.forEach(j=>cols.push([m[0],j,m[1]+' '+j])));
  const rows=[['No','Nama',...cols.map(c=>c[2]),'Rata-rata']];
  N.forEach((n,i)=>{let s=0,k=0;const cells=cols.map(c=>{const r=V[[c[0],c[1],i].join('_')];if(r&&(!r.d||(r.d>=a&&r.d<=b))){s+=r.v;k++;return r.v}return''});rows.push([i+1,n,...cells,k?(s/k).toFixed(1):''])});
  unduh('nilai-'+per.t+'-'+lb+'.csv',rows);
}
function dlCard(){
  const[a,b]=rng();
  return `<div class="card"><h3>⬇️ Unduh rekap</h3><div style="display:flex;gap:6px;margin-bottom:10px">${[['harian','Harian'],['mingguan','Mingguan'],['bulanan','Bulanan']].map(x=>`<button class="seg ${per.t==x[0]?'on':''}" onclick="setPer('${x[0]}')">${x[1]}</button>`).join('')}</div>
  <input type="${per.t=='bulanan'?'month':'date'}" value="${per.v}" onchange="per.v=this.value||today;render()" style="width:100%">
  <p style="font-size:12px;color:var(--mu);margin:8px 0 0">Periode: ${per.t=='mingguan'?a+' s/d '+b:per.t=='bulanan'?per.v:a}${per.t=='mingguan'?' (Senin–Minggu)':''}</p>
  <button class="big" style="background:var(--pr)" onclick="unduhAbsen()">⬇️ Unduh absen (CSV)</button><button class="big" style="background:var(--pr2)" onclick="unduhNilai()">⬇️ Unduh nilai (CSV)</button></div>`;
}
function absenView(){
  const c={Hadir:0,Izin:0,Sakit:0};N.forEach((_,i)=>{const r=todayRec(i);if(r)c[r.status]++});
  const done=c.Hadir+c.Izin+c.Sakit;
  let h=`<div class="card"><div class="stats"><div><b style="color:var(--ok)">${c.Hadir}</b><span>Hadir</span></div><div><b style="color:var(--iz)">${c.Izin}</b><span>Izin</span></div><div><b style="color:var(--sk)">${c.Sakit}</b><span>Sakit</span></div><div><b>${N.length-done}</b><span>Belum</span></div></div><div class="bar"><div style="width:${done/N.length*100}%"></div></div></div>
  <h3 style="margin:14px 4px 8px">👋 Ketuk namamu untuk absen</h3><div class="grid">`;
  N.forEach((n,i)=>{const r=todayRec(i);h+=`<button class="sw ${r?'st-'+r.status:''}" onclick="pick(${i})"><div class="av">${ini(n)}</div><div><span class="n">${n}</span><small>${r?`<span class="tag t-${r.status}">${r.status}</span> ${r.time}`:'Belum absen'}</small></div></button>`});
  return h+'</div>';
}
function rekapView(){
  const dates=[...new Set(Object.values(A).map(r=>r.date))];
  let h=`<div class="card"><h3>📋 Absen hari ini</h3>`;
  N.forEach((n,i)=>{const r=todayRec(i);h+=`<div class="row"><span class="n">${n}</span><select onchange="setAbsen(${i},this.value||null)"><option value="">Belum</option>${['Hadir','Izin','Sakit'].map(s=>`<option ${r&&r.status==s?'selected':''}>${s}</option>`).join('')}</select></div>`});
  h+=`</div><div class="card"><h3>📊 Rekap (${dates.length} hari tercatat)</h3><div class="wrap"><table><tr><th>Nama</th><th>H</th><th>I</th><th>S</th><th>A</th><th>%</th></tr>`;
  N.forEach((n,i)=>{const c={Hadir:0,Izin:0,Sakit:0};dates.forEach(d=>{const r=A[d+'_'+i];if(r)c[r.status]++});const al=dates.length-c.Hadir-c.Izin-c.Sakit;const p=dates.length?Math.round(c.Hadir/dates.length*100):0;
    h+=`<tr><td>${n.split(' ').slice(0,2).join(' ')}</td><td>${c.Hadir}</td><td>${c.Izin}</td><td>${c.Sakit}</td><td style="color:var(--al)">${al}</td><td><b>${p}</b></td></tr>`});
  return h+'</table></div></div>'+dlCard();
}
function nilaiView(){
  let h=`<div class="card"><div style="display:flex;gap:8px"><select style="flex:2" onchange="mp=this.value;render()">${MP.map(m=>`<option value="${m[0]}" ${m[0]==mp?'selected':''}>${m[1]}</option>`).join('')}</select><select style="flex:1" onchange="jt=this.value;render()">${JT.map(j=>`<option ${j==jt?'selected':''}>${j}</option>`).join('')}</select></div></div><div class="card">`;
  let sum=0,cnt=0;
  N.forEach((n,i)=>{const k=[mp,jt,i].join('_'),r=V[k];if(r){sum+=r.v;cnt++}const val=D[k]!==undefined?D[k]:(r?r.v:'');const col=r?(r.v>=75?'var(--ok)':r.v>=60?'var(--iz)':'var(--al)'):'var(--tx)';
    h+=`<div class="row"><span class="n">${i+1}. ${n}</span><input type="number" min="0" max="100" inputmode="numeric" value="${val}" style="color:${col};font-weight:700" oninput="typeNilai(${i},this.value)"></div>`});
  const nd=Object.keys(D).length;
  return h+`</div><button id="sv" class="big" style="background:var(--ok)" onclick="simpanNilai()">💾 Simpan Nilai${nd?' ('+nd+' belum disimpan)':''}</button><div class="card stats" style="grid-template-columns:1fr 1fr;margin-top:12px"><div><b>${cnt?(sum/cnt).toFixed(1):'-'}</b><span>Rata-rata kelas</span></div><div><b>${cnt}/${N.length}</b><span>Nilai tersimpan</span></div></div>`;
}
function render(){
  const tabs=[['absen','✋','Absen']];if(canG)tabs.push(['rekap','📊','Rekap'],['nilai','📝','Nilai']);
  if(!canG&&tab!='absen')tab='absen';
  const note=mode=='wait'?'⏳ Menyambungkan…':mode=='local'?'ℹ️ Mode lokal: data hanya tersimpan di perangkat ini.':'';
  $('#app').innerHTML=(note?`<div class="note">${note}</div>`:'')+(tab=='absen'?absenView():tab=='rekap'?rekapView():nilaiView());
  $('#nav').innerHTML=tabs.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';render()"><i>${t[1]}</i>${t[2]}</button>`).join('');
  $('#nav').style.display=tabs.length>1?'flex':'none';
  document.body.style.paddingBottom=tabs.length>1?'84px':'20px';
  document.querySelectorAll('.sheet').forEach(e=>e.remove());
  if(sel!=null){const s=document.createElement('div');s.className='sheet';s.onclick=e=>{if(e.target==s){sel=null;render()}};
    s.innerHTML=`<div><div style="text-align:center"><div class="av" style="margin:0 auto 8px;width:56px;height:56px;font-size:20px">${ini(N[sel])}</div><b>${N[sel]}</b><p style="color:var(--mu);font-size:13px;margin:4px 0 0">Hari ini kamu…</p></div>
    <button class="big" style="background:var(--ok)" onclick="choose('Hadir')">✅ Hadir</button><button class="big" style="background:var(--iz)" onclick="choose('Izin')">📩 Izin</button><button class="big" style="background:var(--sk)" onclick="choose('Sakit')">🤒 Sakit</button><button class="big ghost" onclick="sel=null;render()">Batal</button></div>`;
    document.body.appendChild(s)}
  if(fb){const s=document.createElement('div');s.className='sheet';s.onclick=e=>{if(e.target==s){fb=null;render()}};
    s.innerHTML=`<div><b>Unduhan langsung belum tersedia di perangkat ini</b><p style="color:var(--mu);font-size:13px">Salin data di bawah, lalu tempel ke Excel / Google Sheets (nama file: ${fb.n}).</p><textarea id="fbt" readonly style="width:100%;height:150px;font:12px monospace;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)">${fb.t}</textarea><button class="big" style="background:var(--pr)" onclick="salin()">📋 Salin data</button><button class="big ghost" onclick="fb=null;render()">Tutup</button></div>`;document.body.appendChild(s)}
}
render();init();
</script>
</body>
</html>
